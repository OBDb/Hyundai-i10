generations:
  - name: "First Generation (PA)"
    start_year: 2007
    end_year: 2015
    description: "The original Hyundai i10 (codenamed PA) was introduced on 31 October 2007 in New Delhi, India. Produced until 2015, it replaced the Hyundai Atos in the model line-up and was initially available only as a five-door hatchback. Built on the Hyundai-Kia SA platform, it featured simple, practical styling with a tall profile to maximize interior space. Engine options included 1.0L and 1.1L I3 petrol engines, a 1.2L Kappa I4 petrol engine (from 2008), and a 1.1L diesel CRDi option for European markets. A facelift introduced in October 2010 brought the 'Fluidic Sculpture' design language with redesigned front end, headlights, and interior updates including a new instrument cluster with gear shift indicator."

  - name: "Second Generation (IA/BA)"
    start_year: 2013
    end_year: 2022
    description: "The second-generation i10 (codenamed IA for Europe, BA for Grand i10 in India) debuted at the Frankfurt Motor Show in September 2013. Built on a new Hyundai-Kia BA platform, it was 80mm longer and 65mm wider than its predecessor. The European model arrived in showrooms in January 2014, while the Indian market received the longer Grand i10 variant (BA) with increased wheelbase. Engine options included 1.0L and 1.2L Kappa II petrol engines, an LPG variant, and a 1.1L U-II diesel CRDi. The platform was shared with the Kia Picanto (TA). A facelift introduced in 2017 updated the front and rear styling. Production continued until 2022, with sedan variants called Hyundai Xcent (India) and exported as Grand i10 sedan to emerging markets."

  - name: "Third Generation (AC3/AI3)"
    start_year: 2019
    end_year: null
    description: "The third-generation i10 was launched in India as the Grand i10 Nios (codenamed AI3) on 7 August 2019, followed by the European-spec i10 (AC3) at the Frankfurt Motor Show in September 2019. The new model features a more expressive design with the signature cascading grille, N Line sporty variants, and significantly upgraded technology including an 8-inch touchscreen infotainment system with Apple CarPlay/Android Auto. Built on a revised BA/K1 platform, the Euro-spec model (AC3) is manufactured in Turkey while Indian models come from Chennai. Engine options expanded to include a turbocharged 1.0L T-GDI three-cylinder engine alongside the naturally aspirated 1.2L, with Idle Stop and Go (ISG) as standard for improved fuel economy. Safety features were upgraded with Hyundai SmartSense including autonomous emergency braking and lane keep assist on higher trims. A facelift was unveiled in February 2023 bringing subtle exterior updates and additional standard technology."